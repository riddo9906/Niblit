services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NIBLIT_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${NIBLIT_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - niblit_memory_qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set a private QDRANT_API_KEY}
volumes:
  niblit_memory_qdrant:
    name: niblit_memory_qdrant
