services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.0}
    restart: unless-stopped
    cpus: "${NIBLIT_QDRANT_CPUS:-1.0}"
    mem_limit: ${NIBLIT_QDRANT_MEMORY:-2g}
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - timeout
        - "3"
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; IFS= read -r reply <&3; [[ "$$reply" == *" 200 "* ]]'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:${NIBLIT_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${NIBLIT_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - niblit_memory_qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set a private QDRANT_API_KEY}
volumes:
  niblit_memory_qdrant:
    name: niblit_memory_qdrant
